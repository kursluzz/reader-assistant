name: Publish to PyPI

# Run by hand, after the GitHub Release for a tag exists. It publishes the exact wheel and sdist
# that the GitHub Release carries, so the PyPI files and the release files are the same bytes.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish, for example v0.1.0"
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/reader-assistant/
    permissions:
      contents: read
      id-token: write # trusted publishing (OIDC); no API token is stored
    env:
      TAG: ${{ inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Download the files of the GitHub Release
        run: |
          mkdir -p dist
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern '*' --dir dist
          ls -l dist
      - name: The release must contain the wheel and sdist of this tag
        run: |
          version="${TAG#v}"
          test -f "dist/reader_assistant-${version}-py3-none-any.whl"
          test -f "dist/reader_assistant-${version}.tar.gz"
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
