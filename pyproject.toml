[project]
name = "reader-assistant"
version = "0.1.0"
description = "Local-first desktop app that reads clipboard text aloud using offline neural TTS."
readme = "README.md"
requires-python = ">=3.12"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Reader Assistant contributors" }]
keywords = ["tts", "text-to-speech", "accessibility", "clipboard", "offline"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]
# Core runtime dependencies are empty on purpose. Engines, audio and the window are optional
# extras (kokoro, piper, audio, gui), so a headless install stays small.
dependencies = []

[project.urls]
Homepage = "https://github.com/kursluzz/reader-assistant"
Repository = "https://github.com/kursluzz/reader-assistant"
Issues = "https://github.com/kursluzz/reader-assistant/issues"

[project.scripts]
reader-assistant = "reader_assistant.cli:main"

[project.optional-dependencies]
kokoro = [
    "kokoro-onnx==0.6.1",
]
piper = [
    "piper-tts==1.8.0",
]
audio = [
    "sounddevice==0.5.6",
]
gui = [
    "pyside6-essentials==6.12.0",
    "shiboken6==6.12.0",
]
# Everything a desktop user needs: both voice engines, sound output and the window.
desktop = [
    "reader-assistant[kokoro,piper,audio,gui]",
]

[build-system]
requires = ["uv_build>=0.12.13,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "bump-my-version>=1.8.1",
    "mypy>=2.4.1",
    "numpy>=2.5.5",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

[tool.bumpversion]
# Run `uv run bump-my-version bump patch|minor|major` on a clean main branch. It edits the files
# below, refreshes uv.lock, commits and creates the tag v<version>. Nothing is pushed.
current_version = "0.1.0"
commit = true
tag = true
tag_name = "v{new_version}"
tag_message = "Release {new_version}"
pre_commit_hooks = ["uv lock", "git add uv.lock"]

[[tool.bumpversion.files]]
filename = "pyproject.toml"
search = 'version = "{current_version}"'
replace = 'version = "{new_version}"'

[[tool.bumpversion.files]]
filename = "README.md"
search = "Version {current_version}, pre-alpha."
replace = "Version {new_version}, pre-alpha."

[[tool.bumpversion.files]]
filename = "CHANGELOG.md"
search = "## [Unreleased]"
replace = "## [Unreleased]\n\n## [{new_version}] - {now:%Y-%m-%d}"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # bugbear
    "UP",   # pyupgrade
    "SIM",  # simplify
    "N",    # pep8-naming
    "RUF",  # ruff-specific
]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
files = ["src", "tests"]
warn_unreachable = true

# Optional engine libraries are imported lazily and may not be installed.
[[tool.mypy.overrides]]
module = ["kokoro_onnx", "kokoro_onnx.*", "piper", "piper.*", "sounddevice"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
filterwarnings = ["error"]
